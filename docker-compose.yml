# Helm — home-server dashboard
#
# Easiest install:  curl -fsSL https://raw.githubusercontent.com/scooperman912-prog/Helm-Dashboard/main/install.sh | bash
# Manual install:   docker compose up -d --build   then open http://<server-ip>:8787
#
# Everything else (password, drives, folders, apps, alerts, assistant) is set up
# in the browser on first visit. Optional: a docker-compose.override.yml next to
# this file for extra mounts (git-ignored) — see docker-compose.override.example.yml.

name: helm

services:
  helm:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
    container_name: helm
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      JARVIS_DATA: /data
      HOST_ROOT: /host/root               # host / is mounted read-only below
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - helm-data:/data
      # Read-only view of the host: lets Helm find your drives, folders, Tailscale
      # and Proxy Manager logs, and read host network counters. Nothing here is writable.
      - /:/host/root:ro
    ports:
      - "${HELM_PORT:-8787}:8000"
    depends_on: [socket-proxy]
    networks: [internal]

  # Helm never touches the Docker socket directly — only this proxy does, with a
  # minimal allow-list (list/inspect/stats/logs + start/stop/restart/pause).
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: helm-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      INFO: 1
      DISABLE_IPV6: 1     # listen on IPv4 only (works on hosts with IPv6 turned off)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

volumes:
  helm-data: {}

networks:
  internal:
    driver: bridge
