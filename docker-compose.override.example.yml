# Optional. Copy to docker-compose.override.yml (git-ignored) for things the
# setup wizard can't do from inside the container. Then: docker compose up -d

services:
  helm:
    volumes:
      # Let the file manager change files in a folder (Settings → Folders shows
      # this snippet for the folders you picked). Host path : /host/root + same path
      - /srv:/host/root/srv:rw
      # - /media:/host/root/media:rw

    # Only listen on one address, e.g. your Tailscale IP:
    # ports: !override
    #   - "100.x.y.z:8787:8000"
